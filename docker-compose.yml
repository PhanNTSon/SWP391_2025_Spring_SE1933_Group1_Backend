version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: steam_clone_db
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
