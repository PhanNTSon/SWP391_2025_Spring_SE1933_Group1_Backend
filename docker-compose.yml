version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: steam_clone_db
    restart: always
    environment:
      POSTGRES_DB: steam_clone_db
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d steam_clone_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - combine

  backend:
    container_name: steam_clone_backend
    image: centurion_backend:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/steam_clone_db
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=sa
    ports:
      - "8080:8080"
    networks:
      - combine

networks:
  combine:
    driver: bridge

volumes:
  postgres_data:
