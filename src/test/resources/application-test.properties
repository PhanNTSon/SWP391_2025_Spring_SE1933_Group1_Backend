# ───────────────────────────────────────────────
# Application Info
spring.application.name=Steam_CLone_DB_TEST

# ───────────────────────────────────────────────
# H2 In-Memory DB Configuration (For Test Only)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ───────────────────────────────────────────────
# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# ───────────────────────────────────────────────
# Static Resources (Keep if needed in test)
spring.web.resources.static-locations=classpath:/resources/

# ───────────────────────────────────────────────
# Multipart (File Upload) - Optional in test
spring.servlet.multipart.enabled=false

# ───────────────────────────────────────────────
# JWT Configuration - Use fixed value for test
jwt.secret=test-secret
jwt.expirationMs=3600000

# ───────────────────────────────────────────────
# Google OAuth2 - Use dummy values for test
spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/oauth2/callback

# ───────────────────────────────────────────────
# Gmail SMTP Configuration - Skip sending real mail in test
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ───────────────────────────────────────────────
# VNPAY Sandbox - Dummy test values
vnpay.tmnCode=TEST_TMNCODE
vnpay.hashSecret=TEST_SECRET
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:5173/payment-result

# ───────────────────────────────────────────────
# Logging
logging.level.org.springframework.security=OFF
logging.level.com.se1933g01.steamclonebackend=ERROR
logging.level.root=ERROR

# ───────────────────────────────────────────────
# Frontend Config
frontend.url=http://localhost:5173

# ───────────────────────────────────────────────
# Server Port (Optional for test)
server.port=0

# ───────────────────────────────────────────────
# Cloudflare R2 - Optional, dummy test
r2.access-key=dummy-access-key
r2.secret-key=dummy-secret-key
