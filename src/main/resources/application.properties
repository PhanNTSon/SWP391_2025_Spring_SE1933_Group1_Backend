spring.application.name=steam_clone_backend

# SQL Server Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Steam_Clone_DB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JPA settings
spring.jpa.hibernate.ddl-auto=none  
# or validate/update/create depending on your case
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# QUAN TRỌNG: Đảm bảo rằng bạn KHÔNG có hoặc đã VÔ HIỆU HÓA (comment out) dòng sau:
# spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
# HOẶC bất kỳ cấu hình physical-strategy nào khác mà có thể gây ra việc chuyển đổi tên.
