# ───────────────────────────────────────────────
# Application Info
spring.application.name=Steam_CLone_DB

# ───────────────────────────────────────────────
# PostgreSQL Configuration (Currently Active)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ───────────────────────────────────────────────
# SQL Server Configuration (Commented)
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Steam_CLone_DB;encrypt=true;trustServerCertificate=true
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ───────────────────────────────────────────────
# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update        
# can be: validate | update | create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# ───────────────────────────────────────────────
# Static Resources
spring.web.resources.static-locations=classpath:/resources/

# ───────────────────────────────────────────────
# Multipart (File Upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=20GB

# ───────────────────────────────────────────────
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS}  
# 1 hour

# ───────────────────────────────────────────────
# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ───────────────────────────────────────────────
# Google Drive Integration
gdrive.service_account.key_file_path=${GDRIVE_KEY_FILE_PATH}
gdrive.folder.avatars.id=${GDRIVE_FOLDER_AVATARS_ID}

# ───────────────────────────────────────────────
# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ───────────────────────────────────────────────
# VNPAY Sandbox Configuration
vnpay.tmnCode=${VNPAY_TMNCODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL}
# vnpay.returnUrl=http://localhost:5173/payment-result  

# ───────────────────────────────────────────────
# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.se1933g01.steamclonebackend=DEBUG

# ───────────────────────────────────────────────
# Frontend Config
frontend.url=${FRONTEND_URL}

# ───────────────────────────────────────────────
# Server Port
server.port=${PORT:8080}
