# ───────────────────────────────────────────────
# Application Info
spring.application.name=Steam_CLone_DB

# ───────────────────────────────────────────────
# PostgreSQL Configuration (Currently Active)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ───────────────────────────────────────────────
# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# ───────────────────────────────────────────────
# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.flyway.detect-encoding=true
spring.flyway.clean-disabled=false

# ───────────────────────────────────────────────
# SQL Server Configuration (Commented)
# Static Resources
spring.web.resources.static-locations=classpath:/resources/

# ───────────────────────────────────────────────
# Multipart (File Upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=20GB

# ───────────────────────────────────────────────
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS}  
# 1 hour

# ───────────────────────────────────────────────
# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_LOGIN_URL}

# ───────────────────────────────────────────────
# Google Drive Integration
# gdrive.service_account.key_file_path=${GDRIVE_KEY_FILE_PATH}
# gdrive.folder.avatars.id=${GDRIVE_FOLDER_AVATARS_ID}

# ───────────────────────────────────────────────
# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ───────────────────────────────────────────────
# VNPAY Sandbox Configuration
vnpay.tmnCode=${VNPAY_TMNCODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL}
# vnpay.returnUrl=http://localhost:5173/payment-result  

# ───────────────────────────────────────────────
# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.se1933g01.steamclonebackend=WARN
logging.level.root=WARN
#test 
# ───────────────────────────────────────────────
# Frontend Config
frontend.url=${FRONTEND_URL}

# Server Port
server.port=${PORT:8080}
server.address=0.0.0.0



# If credentials are set to "mock" or left empty, the application will fallback to local mock storage/validation.

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:mock}
cloudinary.api-key=${CLOUDINARY_API_KEY:mock}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:mock}

# Cloudflare R2 Storage
r2.endpoint=${R2_ENDPOINT:https://ce2d1d4b1db731e41135ed96b83b118b.r2.cloudflarestorage.com}
r2.bucket-name=${R2_BUCKET_NAME:steam}
r2.access-key=${R2_ACCESS_KEY:mock}
r2.secret-key=${R2_SECRET_KEY:mock}

# YouTube API
youtube.api.key=${YOUTUBE_API_KEY:mock}

# Gemini API
gemini.key=${GEMINI_API_KEY:mock}
# ───────────────────────────────────────────────
# Prometheus Metrics
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.metrics.tags.application=centurion-be
